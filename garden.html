<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Gift For You 🌸</title>
  <link rel="stylesheet" href="flower.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    html, body { width:100%; height:100%; margin:0; overflow:hidden; background: linear-gradient(160deg,#ffe4f0 0%,#ffd6e8 50%,#fce4ec 100%); }

    .garden-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* LEFT: text */
    .garden-left {
      width: 45%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6vw;
      gap: 20px;
      animation: fadeUp 1.2s ease 0.4s both;
      z-index: 2;
    }
    .garden-left .tag {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c94b7b;
      font-family: 'Lato', sans-serif;
    }
    .garden-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      color: #a0304e;
      line-height: 1.25;
      margin: 0;
    }
    .garden-left h1 em { font-style: italic; color: #c94b7b; }
    .garden-left p {
      font-family: 'Lato', sans-serif;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      color: #7a4a5a;
      line-height: 1.8;
      margin: 0;
    }
    .garden-left .envelope-wrap { margin-top: 8px; }
    .envelope      { width: 100px; height: 70px; }
    .env-flap      { height: 38px; }
    .env-heart     { font-size: 1.3rem; }
    .envelope-wrap span { font-size: 0.9rem; color: #c94b7b; }

    /* RIGHT: flower scene — strictly contained */
    .garden-right {
      width: 55%;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    /* scale-down wrapper centered in right panel */
    .flower-scene {
      position: absolute;
      bottom: 68px;
      left: 0;
      width: 100%;
      height: calc(100% - 1px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-right: 720px;
      transform: scale(0.65);
      transform-origin: bottom center;
      position: relative;
      width: 900px;
      flex-shrink: 0;
    }

    /* ground line — sits right below the flower stems */
    .garden-ground {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(to right, #f9a8c9, #e8638c, #f9a8c9);
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(232,99,140,0.35);
      z-index: 20;
    }
  </style>
</head>
<body class="not-loaded">

      <span class="tag">Flowers for you baby</span>
      <h1>Congratulations, Baby</h1>

          </div>

          <div class="env-heart">💌</div>

  <script>
    onload = () => {
      const c = setTimeout(() => {
        document.body.classList.remove("not-loaded");
        clearTimeout(c);
      }, 1000);
    };
  </script>

</html>
